services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bagis}:${POSTGRES_PASSWORD:-bagis123}@db:5432/${POSTGRES_DB:-bagis_db}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DEFAULT_COUNTRY_CODE=${DEFAULT_COUNTRY_CODE:-90}
      - NODE_ENV=${NODE_ENV:-production}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bagis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bagis123}
      POSTGRES_DB: ${POSTGRES_DB:-bagis_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bagis} -d ${POSTGRES_DB:-bagis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
